# Netlify build/deploy config for adamsfreshstart.com
# Astro static site. Netlify Functions live in netlify/functions.

[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Force www to the apex host (https handled by Netlify)
[[redirects]]
  from = "https://www.adamsfreshstart.com/*"
  to = "https://adamsfreshstart.com/:splat"
  status = 301
  force = true

# Old single-page anchors
[[redirects]]
  from = "/thank-you.html"
  to = "/thank-you/"
  status = 301
